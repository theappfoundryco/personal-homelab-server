# Which AI models and settings suit which machine. Data, not code: tune the numbers here.
# rules: the first one that matches wins. ram is in GB; gpu is one of nvidia, amd, apple, intel, none, unknown.
rules:
  - { profile: large,  min_ram: 16, min_vram: 8 }            # a graphics card with room for big models
  - { profile: large,  min_ram: 32 }
  - { profile: medium, min_ram: 16, gpu: [apple] }           # Apple silicon shares its memory with the graphics chip
  - { profile: medium, min_ram: 16 }
  - { profile: small,  min_ram: 8 }
  - { profile: small,  min_ram: 5 }
  - { profile: tiny }                                        # everything else, including a machine we could not read

# size_gb is the download, ram_gb is the memory it needs while running (about 1.3 times the download).
models:
  "llama3.2:1b":  { size_gb: 1.3, ram_gb: 2 }
  "llama3.2:3b":  { size_gb: 2.0, ram_gb: 3 }
  "qwen3.5:4b":   { size_gb: 3.4, ram_gb: 5 }
  "qwen3.5:9b":   { size_gb: 6.6, ram_gb: 9 }
  "gemma4:26b":   { size_gb: 17,  ram_gb: 22 }
  "embeddinggemma": { size_gb: 0.6, ram_gb: 1 }

profiles:
  tiny:
    title: Small board
    about: Under about 5 GB of memory. Local AI would be too slow, so the AI features stay off or use another machine's Ollama.
    chat: null
    journal: null
    embed: null
    whisper: tiny
    metrics_days: 15
    lite_monitoring: true
  small:
    title: Small server
    about: 5 to 15 GB of memory and no big graphics card. A small model handles everyday chat.
    chat: "llama3.2:3b"
    journal: null
    embed: embeddinggemma
    whisper: tiny
    metrics_days: 30
    lite_monitoring: false
  medium:
    title: Everyday machine
    about: 16 GB or more, or an Apple silicon Mac. A quick model for chat and a bigger one for the nightly journal.
    chat: "qwen3.5:4b"
    journal: "qwen3.5:9b"
    embed: embeddinggemma
    whisper: small
    metrics_days: 90
    lite_monitoring: false
  large:
    title: Powerful machine
    about: 32 GB or more, or a graphics card with 8 GB or more. Room for the best local models.
    chat: "qwen3.5:4b"
    journal: "gemma4:26b"
    embed: embeddinggemma
    whisper: medium
    metrics_days: 90
    lite_monitoring: false
