        widget:
          type: watchtower
          url: http://watchtower:8080
          key: "{{HOMEPAGE_VAR_WATCHTOWER_TOKEN}}"
- Network & AI:
    - AdGuard Home:
        icon: adguard-home.svg
        href: http://{{HOMEPAGE_VAR_HOSTNAME}}:3002
        description: DNS filtering
        server: local
        container: adguard
        widget:
          type: adguard
          url: http://host.docker.internal:3002
          username: admin
          password: "{{HOMEPAGE_VAR_ADGUARD_PASS}}"
    - Tailscale:
        icon: tailscale-light.svg
        href: https://login.tailscale.com/admin/machines
        description: Your private network
        widget:
          type: prometheusmetric
          url: http://prometheus:9090
          refreshInterval: 5000
          metrics:
            - label: In
              query: round(rate(node_network_receive_bytes_total{device="tailscale0"}[1m]))
              format: { type: byterate, options: { maximumFractionDigits: 1 } }
            - label: Out
              query: round(rate(node_network_transmit_bytes_total{device="tailscale0"}[1m]))
              format: { type: byterate, options: { maximumFractionDigits: 1 } }
            - label: 24h
              query: round(increase(node_network_receive_bytes_total{device="tailscale0"}[24h]) + increase(node_network_transmit_bytes_total{device="tailscale0"}[24h]))
              format: { type: bytes, options: { maximumFractionDigits: 1 } }
    - Wi-Fi Uplink:
        icon: mdi-wifi-#f59e0b
        href: http://{{HOMEPAGE_VAR_HOSTNAME}}:3000/d/homelab-command?kiosk
        description: wlp2s0
        widget:
          type: prometheusmetric
          url: http://prometheus:9090
          refreshInterval: 5000
          metrics:
            - label: Down
              query: round(rate(node_network_receive_bytes_total{device="wlp2s0"}[1m]))
              format: { type: byterate, options: { maximumFractionDigits: 1 } }
            - label: Up
              query: round(rate(node_network_transmit_bytes_total{device="wlp2s0"}[1m]))
              format: { type: byterate, options: { maximumFractionDigits: 1 } }
            - label: 24h
              query: round(increase(node_network_receive_bytes_total{device="wlp2s0"}[24h]) + increase(node_network_transmit_bytes_total{device="wlp2s0"}[24h]))
              format: { type: bytes, options: { maximumFractionDigits: 1 } }
    - Homelab AI:
        icon: open-webui.svg
        href: http://{{HOMEPAGE_VAR_HOSTNAME}}:8081
        description: Local LLMs via Ollama
        server: local
        container: ollama
        widget:
          type: prometheusmetric
          url: http://prometheus:9090
          refreshInterval: 10000
          metrics:
            - label: CPU
              query: round(sum(rate(container_cpu_usage_seconds_total{name="ollama"}[2m])) * 100, 0.01)
              format: { type: text, suffix: " %" }
            - label: Memory
              query: sum(container_memory_working_set_bytes{name="ollama"})
              format: { type: bbytes, options: { maximumFractionDigits: 1 } }
            - label: Uptime
              query: round((time() - max(container_start_time_seconds{name="ollama"})) / 3600, 0.1)
              format: { type: text, suffix: " h" }
