# Homelab landing page. Same-origin API proxies so the page needs no CORS.
server {
  listen 80;
  root /usr/share/nginx/html;
  resolver 127.0.0.11 valid=30s ipv6=off;  # Docker DNS, resolved per request so a stopped container can't break startup

  location = / { add_header Cache-Control "no-cache"; try_files /index.html =404; }
  # Dashboard files that belong to a module (read only; only each module's web/ folder is reachable)
  location ~ ^/m/([a-z0-9_]+)/web/([A-Za-z0-9_.-]+)$ { alias /usr/share/modules/$1/web/$2; add_header Cache-Control "no-cache"; }
  location ~* \.(css|js)$ { add_header Cache-Control "no-cache"; }  # a git pull shows up on the next load

  # Prometheus queries (read only)
  location /api/prom/ {
    limit_except GET { deny all; }
    set $up http://prometheus:9090;
    rewrite ^/api/prom/(query|query_range)$ /api/v1/$1 break;
    return 404;
    proxy_pass $up;
  }

  # Run the briefing or news workflow now
  location = /api/run/briefing {  # the bot builds the briefing now
        set $bot http://telegram-bot:8080;
        proxy_pass $bot/brief/run;
    }
    location ~ ^/api/run/(briefing|news)$ {
    limit_except GET { deny all; }
    set $up http://n8n:5678;
    rewrite ^/api/run/(.*)$ /webhook/$1 break;
    proxy_pass $up;
  }

  # Bot API: extras (location, agenda, notes), notes, ask-the-AI (streamed)
  location /api/bot/ {
    set $up http://telegram-bot:8080;
    rewrite ^/api/bot/(.*)$ /$1 break;
    proxy_pass $up;
    proxy_buffering off;
    proxy_read_timeout 300s;
  }

  # Daily stats written by homelab-daily-stats.timer
  location = /api/daily.json {
    add_header Cache-Control "no-cache";
    alias /srv/stats/daily.json;
  }

  # This machine's specs and live numbers, written by the host helper (core/hostinfo.py)
  location = /api/host.json {
    add_header Cache-Control "no-cache";
    alias /srv/stats/host.json;
  }

  # Hardware specs written by homelab-specs.timer
  location = /api/specs.json {
    add_header Cache-Control "no-cache";
    alias /srv/stats/specs.json;
  }

  # GitHub backup status written by homelab-git-sync
  location = /api/git-backup.json {
    add_header Cache-Control "no-cache";
    alias /srv/stats/git-backup.json;
  }

  # Static files: icons and the web app manifest
  location ~ ^/(icon-\d+\.png|favicon-\d+\.png|favicon\.svg|manifest\.webmanifest)$ {
    add_header Cache-Control "max-age=86400";
    types { image/png png; image/svg+xml svg; application/manifest+json webmanifest; }
  }

  location / { return 404; }
}
