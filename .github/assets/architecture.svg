<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-labelledby="t d"><title id="t">How it fits together</title><desc id="d">Your browser and Telegram talk to the dashboard and the core, which run in Docker on your machine. The core uses optional apps and keeps your data in the home folder.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#8a8a8a" stroke-width="1.5"/></marker></defs><rect width="960" height="400" rx="12" fill="#161616"/><text x="40" y="38" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#8a8a8a" letter-spacing="1">YOU</text><text x="330" y="38" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#8a8a8a" letter-spacing="1">YOUR MACHINE, IN DOCKER</text><text x="720" y="38" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#8a8a8a" letter-spacing="1">OPTIONAL APPS YOU CHOOSE</text><rect x="310" y="52" width="360" height="236" rx="10" fill="none" stroke="#333333" stroke-dasharray="4 4"/><rect x="40" y="70" width="200" height="64" rx="8" fill="#222222" stroke="#444444"/><text x="140.0" y="99.0" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#f2f2f2">Browser or phone</text><text x="140.0" y="118.0" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#a8a8a8">the dashboard</text><rect x="40" y="170" width="200" height="64" rx="8" fill="#222222" stroke="#444444"/><text x="140.0" y="199.0" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#f2f2f2">Telegram</text><text x="140.0" y="218.0" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#a8a8a8">talk in plain words</text><rect x="340" y="70" width="300" height="64" rx="8" fill="#222222" stroke="#444444"/><text x="490.0" y="99.0" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#f2f2f2">Dashboard</text><text x="490.0" y="118.0" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#a8a8a8">web pages, port 3095</text><rect x="340" y="170" width="300" height="96" rx="8" fill="#222222" stroke="#444444"/><text x="490.0" y="215.0" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#f2f2f2">Core</text><text x="490.0" y="234.0" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#a8a8a8">API, scheduler, bot, 19 modules</text><rect x="710" y="70" width="210" height="50" rx="8" fill="#222222" stroke="#444444"/><text x="815.0" y="92.0" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#f2f2f2">Local AI</text><text x="815.0" y="111.0" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#a8a8a8">Ollama, Open WebUI, Whisper</text><rect x="710" y="132" width="210" height="50" rx="8" fill="#222222" stroke="#444444"/><text x="815.0" y="154.0" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#f2f2f2">Monitoring</text><text x="815.0" y="173.0" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#a8a8a8">Grafana, Uptime Kuma, Dozzle</text><rect x="710" y="194" width="210" height="50" rx="8" fill="#222222" stroke="#444444"/><text x="815.0" y="216.0" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#f2f2f2">Automation and search</text><text x="815.0" y="235.0" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#a8a8a8">n8n, SearXNG</text><rect x="710" y="256" width="210" height="50" rx="8" fill="#222222" stroke="#444444"/><text x="815.0" y="278.0" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#f2f2f2">Network</text><text x="815.0" y="297.0" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#a8a8a8">AdGuard Home, Homepage</text><rect x="340" y="318" width="300" height="56" rx="8" fill="#222222" stroke="#444444"/><text x="490.0" y="343.0" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#f2f2f2">Your data, in ~/.homelab</text><text x="490.0" y="362.0" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#a8a8a8">settings, journal, backups</text><path d="M240 102L336 102" stroke="#8a8a8a" stroke-width="1.5" fill="none" marker-end="url(#a)"/><path d="M490 134L490 168" stroke="#8a8a8a" stroke-width="1.5" fill="none" marker-end="url(#a)"/><path d="M240 202L336 214" stroke="#8a8a8a" stroke-width="1.5" fill="none" marker-end="url(#a)"/><path d="M640 202L706 202" stroke="#8a8a8a" stroke-width="1.5" fill="none" marker-end="url(#a)"/><path d="M490 266L490 314" stroke="#8a8a8a" stroke-width="1.5" fill="none" marker-end="url(#a)"/></svg>
