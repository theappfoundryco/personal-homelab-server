name: Bug report
description: Something does not work the way it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. Please read the checkbox at the bottom before you submit. Output from `homelab status` and logs can hold names, addresses and other personal details.
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Linux (Debian or Ubuntu)
        - Linux (Fedora or other)
        - Raspberry Pi
        - Windows with WSL2
        - Other
    validations:
      required: true
  - type: input
    id: docker
    attributes:
      label: Docker and version
      description: For example Colima, OrbStack, Docker Desktop or Docker Engine, and the output of `docker --version`.
    validations:
      required: true
  - type: dropdown
    id: method
    attributes:
      label: How you installed it
      options:
        - The one-line install command
        - git clone and ./install.sh
        - Updated with homelab update
        - Other
    validations:
      required: true
  - type: textarea
    id: status
    attributes:
      label: Output of `homelab status`
      render: shell
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead
      description: Add the install log (`~/.homelab/install.log`) or a screenshot if it helps.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I removed personal information (names, addresses, tokens, hostnames, IPs, emails) from everything above.
          required: true
